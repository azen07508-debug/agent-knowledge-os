<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MingLi Agent · 本地控制台</title>
<style>
  :root {
    --bg: #f7f6f3;
    --panel: #ffffff;
    --ink: #1d1c1a;
    --muted: #6b675f;
    --line: #e3e0d9;
    --accent: #1f5f4b;
    --error: #8a3b12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .status { color: var(--muted); font-size: 13px; }
  main {
    display: grid;
    grid-template-columns: minmax(300px, 360px) 1fr;
    gap: 20px;
    padding: 20px 24px;
    align-items: start;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font: inherit;
  }
  .field { margin-bottom: 10px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  button {
    padding: 8px 14px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  button.secondary { background: #fff; color: var(--accent); }
  button:disabled { opacity: .55; cursor: wait; }
  #result {
    display: block;
    min-height: 340px;
    margin: 0;
    padding: 14px;
    background: #16150f;
    color: #e9e6da;
    border-radius: 6px;
    font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-x: auto;
  }
  #result.error { color: #ffb59a; }
  .note { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .zodiac-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .zodiac-cards article { padding: 12px; background: var(--bg); border-radius: 6px; }
  .zodiac-cards h3 { margin: 0; font-size: 13px; color: var(--muted); }
  .zodiac-cards p { margin: 6px 0 0; font-size: 18px; }
  #western-summary { margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>MingLi Agent · 本地控制台</h1>
  <span class="status" id="status">检查服务中…</span>
</header>

<main>
  <section>
    <h2>出生信息</h2>
    <div class="grid">
      <div><label for="year">年</label><input id="year" type="number" value="1990" min="1" max="9999"></div>
      <div><label for="month">月</label><input id="month" type="number" value="2" min="1" max="12"></div>
      <div><label for="day">日</label><input id="day" type="number" value="1" min="1" max="31"></div>
      <div><label for="hour">时（0-23）</label><input id="hour" type="number" value="12" min="0" max="23"></div>
    </div>

    <div class="grid field" style="margin-top:10px">
      <div><label for="minute">分（0–59）</label><input id="minute" type="number" value="0" min="0" max="59"></div>
      <div style="grid-column:span 3">
        <label for="time_precision">出生时间精度</label>
        <select id="time_precision"><option value="minute">准确到分钟</option><option value="day">只知道日期（仅太阳/月亮星座）</option></select>
      </div>
    </div>
    <div class="field">
      <label for="timezone">出生地时区</label>
      <input id="timezone" value="Asia/Shanghai" placeholder="例如 America/New_York">
    </div>
    <div class="grid field">
      <div style="grid-column:span 2"><label for="longitude">出生地经度（可选）</label><input id="longitude" type="number" min="-180" max="180" step="any" placeholder="东经为正"></div>
      <div style="grid-column:span 2"><label for="latitude">出生地纬度（可选）</label><input id="latitude" type="number" min="-90" max="90" step="any" placeholder="北纬为正"></div>
    </div>
    <div class="field">
      <label for="fold">夏令时重复时刻</label>
      <select id="fold"><option value="">通常无需选择</option><option value="0">前一次</option><option value="1">后一次</option></select>
    </div>

    <div class="field" style="margin-top:10px">
      <label for="gender">性别</label>
      <select id="gender"><option value="">未指定</option><option>男</option><option>女</option></select>
    </div>

    <div class="field">
      <label for="question">问题（用于分析与报告）</label>
      <input id="question" value="事业与财运">
    </div>

    <div class="field">
      <label for="school">school（三项留空则只返回结构事实，不跑策略）</label>
      <input id="school" placeholder="classical">
    </div>
    <div class="field">
      <label for="policy">policy</label>
      <input id="policy" placeholder="classical_approx_v1">
    </div>
    <div class="field">
      <label for="version">version</label>
      <input id="version" placeholder="1">
    </div>

    <div class="field">
      <label for="apikey">X-API-Key（服务端配置 MINGLI_API_KEY 时必填，仅存在本机浏览器）</label>
      <input id="apikey" type="password" autocomplete="off" placeholder="未配置则留空">
    </div>

    <div class="field">
      <label for="leap_month">紫微闰月归属（leap_month）</label>
      <select id="leap_month">
        <option value="split">split · 前半月归本月、后半月归下月</option>
        <option value="preceding">preceding · 整月归本月</option>
        <option value="following">following · 整月归下月</option>
      </select>
    </div>

    <div class="grid" style="grid-template-columns: 1fr 1fr">
      <div><label for="target_year">窗口年份</label><input id="target_year" type="number" value="2026" min="1" max="9997"></div>
      <div>
        <label for="relation">结构关系</label>
        <select id="relation"><option>六冲</option><option>六合</option><option>六害</option><option>相破</option></select>
      </div>
    </div>

    <div class="actions">
      <button data-run="chart">排八字</button>
      <button data-run="analyze" class="secondary">分析</button>
      <button data-run="ziwei" class="secondary">排紫微</button>
      <button data-run="western" class="secondary">太阳/月亮星座</button>
      <button data-run="windows" class="secondary">事件窗口</button>
    </div>
    <p class="note">
      所有计算在本地完成，LLM 不参与排盘；返回值只含结构事实与证据，不含吉凶断语。
    </p>
    <p class="note">太阳/月亮星座使用回归黄道，支持 1900–2100 年。仅日期或星座交界存在不确定性时显示候选；本期不计算上升与宫位。</p>
  </section>

  <section>
    <h2>结果</h2>
    <div id="western-summary" hidden>
      <div class="zodiac-cards">
        <article><h3>太阳星座</h3><p id="sun-sign"></p></article>
        <article><h3>月亮星座</h3><p id="moon-sign"></p></article>
      </div>
      <p id="western-note" class="note"></p>
    </div>
    <pre id="result" role="status" aria-live="polite">选择左侧动作后显示结果。</pre>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const result = $("result");

  function numberInput(id, optional = false) {
    const text = $(id).value.trim();
    if (!text) {
      if (optional) return null;
      throw new Error($(id).labels[0].textContent + "不能为空");
    }
    const value = Number(text);
    if (!Number.isFinite(value)) throw new Error("请输入有效数字");
    return value;
  }

  function birth(allowUnknown = false) {
    const unknown = $("time_precision").value === "day";
    if (unknown && !allowUnknown) throw new Error("此操作需要出生时间；只知道日期时请选择太阳/月亮星座");
    const timezone = $("timezone").value.trim();
    if (!timezone) throw new Error("请填写出生地时区");
    return {
      year: numberInput("year"),
      month: numberInput("month"),
      day: numberInput("day"),
      hour: unknown ? null : numberInput("hour"),
      minute: unknown ? 0 : numberInput("minute"),
      timezone,
      longitude: numberInput("longitude", true),
      latitude: numberInput("latitude", true),
      fold: unknown ? null : numberInput("fold", true),
      gender: $("gender").value || null,
    };
  }

  function selector() {
    const values = ["school", "policy", "version"].map((key) => $(key).value.trim());
    const filled = values.filter(Boolean).length;
    if (filled !== 0 && filled !== 3) throw new Error("school、policy、version 必须同时填写或同时留空");
    return filled === 3 ? { school: values[0], policy: values[1], version: values[2] } : {};
  }

  const ACTIONS = {
    chart: () => ({ path: "/api/chart", body: birth() }),
    analyze: () => ({
      path: "/api/analyze",
      body: { ...birth(), question: $("question").value, ...selector() },
    }),
    ziwei: () => ({ path: "/api/ziwei", body: { ...birth(), leap_month: $("leap_month").value } }),
    western: () => ({ path: "/api/western/chart", body: birth(true) }),
    windows: () => ({
      path: "/api/windows",
      body: { ...birth(), target_year: numberInput("target_year"), relation: $("relation").value },
    }),
  };

  async function call(action) {
    result.classList.remove("error");
    $("western-summary").hidden = true;
    let request;
    try {
      request = ACTIONS[action]();
    } catch (error) {
      result.classList.add("error");
      result.textContent = "错误：" + error.message;
      return;
    }

    document.querySelectorAll("button[data-run]").forEach((button) => (button.disabled = true));
    result.textContent = "计算中…";
    try {
      const headers = { "Content-Type": "application/json" };
      const key = $("apikey").value.trim();
      if (key) {
        headers["X-API-Key"] = key;
        localStorage.setItem("mingli-api-key", key);
      }
      const response = await fetch(request.path, {
        method: "POST",
        headers,
        body: JSON.stringify(request.body),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
      }
      result.textContent = JSON.stringify(data, null, 2);
      if (action === "western") {
        for (const body of ["sun", "moon"]) {
          const position = data.chart[body];
          $(body + "-sign").textContent = position.sign || "可能是 " + position.possible_signs.join(" / ");
        }
        $("western-note").textContent = data.chart.time_precision === "day"
          ? "按出生地当天完整时间范围计算候选，未补出生时刻。"
          : "按出生时刻计算；交界落在计算误差范围内时显示相邻候选。";
        $("western-summary").hidden = false;
      }
    } catch (error) {
      result.classList.add("error");
      result.textContent = "错误：" + error.message;
    } finally {
      document.querySelectorAll("button[data-run]").forEach((button) => (button.disabled = false));
    }
  }

  document.querySelectorAll("button[data-run]").forEach((button) => {
    button.addEventListener("click", () => call(button.dataset.run));
  });

  $("apikey").value = localStorage.getItem("mingli-api-key") || "";
  $("time_precision").addEventListener("change", () => {
    const unknown = $("time_precision").value === "day";
    for (const id of ["hour", "minute", "fold"]) $(id).disabled = unknown;
    $("western-summary").hidden = true;
  });

  fetch("/api/health")
    .then((response) => response.json())
    .then((data) => ($("status").textContent = `服务正常 · provider ${data.provider}`))
    .catch(() => ($("status").textContent = "服务不可用"));
</script>
</body>
</html>
